lass="line">116</span><br/><span class="line">117</span><br/><span class="line">118</span><br/><span class="line">119</span><br/><span class="line">120</span><br/><span class="line">121</span><br/><span class="line">122</span><br/><span class="line">123</span><br/><span class="line">124</span><br/><span class="line">125</span><br/><span class="line">126</span><br/><span class="line">127</span><br/><span class="line">128</span><br/><span class="line">129</span><br/><span class="line">130</span><br/><span class="line">131</span><br/><span class="line">132</span><br/></pre></td><td class="code"><pre><span class="line"><span class="keyword">package</span> com.demo.s146;</span><br/><span class="line"></span><br/><span class="line"><span class="keyword">import</span> java.util.HashMap;</span><br/><span class="line"><span class="keyword">import</span> java.util.Map;</span><br/><span class="line"></span><br/><span class="line"><span class="comment">/**</span></span><br/><span class="line"><span class="comment"> * LRU 缓存</span></span><br/><span class="line"><span class="comment"> * 请你设计并实现一个满足  LRU (最近最少使用) 缓存 约束的数据结构。</span></span><br/><span class="line"><span class="comment"> * 实现 LRUCache 类：</span></span><br/><span class="line"><span class="comment"> * LRUCache(int capacity) 以 正整数 作为容量 capacity 初始化 LRU 缓存</span></span><br/><span class="line"><span class="comment"> * int get(int key) 如果关键字 key 存在于缓存中，则返回关键字的值，否则返回 -1 。</span></span><br/><span class="line"><span class="comment"> * void put(int key, int value) 如果关键字 key 已经存在，则变更其数据值 value ；如果不存在，则向缓存中插入该组 key-value 。如果插入操作导致关键字数量超过 capacity ，则应该 逐出 最久未使用的关键字。</span></span><br/><span class="line"><span class="comment"> * 函数 get 和 put 必须以 O(1) 的平均时间复杂度运行。</span></span><br/><span class="line"><span class="comment"> *</span></span><br/><span class="line"><span class="comment"> *</span></span><br/><span class="line"><span class="comment"> *</span></span><br/><span class="line"><span class="comment"> * 来源：力扣（LeetCode）</span></span><br/><span class="line"><span class="comment"> * 链接：https://leetcode.cn/problems/lru-cache</span></span><br/><span class="line"><span class="comment"> * 著作权归领扣网络所有。商业转载请联系官方授权，非商业转载请注明出处。</span></span><br/><span class="line"><span class="comment"> */</span></span><br/><span class="line"><span class="keyword">class</span> <span class="title class_">LRUCache</span> {</span><br/><span class="line"></span><br/><span class="line">    <span class="comment">//LRU队列中的元素定义 双向链表存储 方便随机访问 删除 添加操作</span></span><br/><span class="line">    <span class="keyword">class</span> <span class="title class_">DLinkedNode</span> {</span><br/><span class="line">        <span class="comment">//缓存key</span></span><br/><span class="line">        <span class="type">int</span> key;</span><br/><span class="line">        <span class="comment">//缓存值</span></span><br/><span class="line">        <span class="type">int</span> value;</span><br/><span class="line">        <span class="comment">//队列前一个节点</span></span><br/><span class="line">        DLinkedNode prev;</span><br/><span class="line">        <span class="comment">//队列后一个节点</span></span><br/><span class="line">        DLinkedNode next;</span><br/><span class="line">        <span class="keyword">public</span> <span class="title function_">DLinkedNode</span><span class="params">()</span> {}</span><br/><span class="line">        <span class="keyword">public</span> <span class="title function_">DLinkedNode</span><span class="params">(<span class="type">int</span> _key, <span class="type">int</span> _value)</span> {key = _key; value = _value;}</span><br/><span class="line">    }</span><br/><span class="line">    <span class="comment">//LRU缓存map&lt;缓存的值, 缓存的元素&gt;</span></span><br/><span class="line">    <span class="keyword">private</span> Map&lt;Integer, DLinkedNode&gt; cache = <span class="keyword">new</span> <span class="title class_">HashMap</span>&lt;Integer, DLinkedNode&gt;();</span><br/><span class="line">    <span class="comment">//缓存大小</span></span><br/><span class="line">    <span class="keyword">private</span> <span class="type">int</span> size;</span><br/><span class="line">    <span class="comment">//缓存容量</span></span><br/><span class="line">    <span class="keyword">private</span> <span class="type">int</span> capacity;</span><br/><span class="line">    <span class="comment">//头结点 尾节点</span></span><br/><span class="line">    <span class="keyword">private</span> DLinkedNode head, tail;</span><br/><span class="line">    <span class="comment">//缓存初始化</span></span><br/><span class="line">    <span class="keyword">public</span> <span class="title function_">LRUCache</span><span class="params">(<span class="type">int</span> capacity)</span> {</span><br/><span class="line">        <span class="built_in">this</span>.size = <span class="number">0</span>;</span><br/><span class="line">        <span class="built_in">this</span>.capacity = capacity;</span><br/><span class="line">        <span class="comment">//使用伪头部和伪尾部节点 方便尾部查询，头部删除</span></span><br/><span class="line">        head = <span class="keyword">new</span> <span class="title class_">DLinkedNode</span>();</span><br/><span class="line">        tail = <span class="keyword">new</span> <span class="title class_">DLinkedNode</span>();</span><br/><span class="line">        head.next = tail;</span><br/><span class="line">        tail.prev = head;</span><br/><span class="line">    }</span><br/><span class="line">    <span class="comment">//查询缓存</span></span><br/><span class="line">    <span class="keyword">public</span> <span class="type">int</span> <span class="title function_">get</span><span class="params">(<span class="type">int</span> key)</span> {</span><br/><span class="line">        <span class="comment">//先从map中取</span></span><br/><span class="line">        <span class="type">DLinkedNode</span> <span class="variable">node</span> <span class="operator">=</span> cache.get(key);</span><br/><span class="line">        <span class="keyword">if</span> (node == <span class="literal">null</span>) {</span><br/><span class="line">            <span class="keyword">return</span> -<span class="number">1</span>;</span><br/><span class="line">        }</span><br/><span class="line">        <span class="comment">//如果 key 存在，先通过哈希表定位，再移到头部， 头插尾删。</span></span><br/><span class="line">        moveToHead(node);</span><br/><span class="line">        <span class="keyword">return</span> node.value;</span><br/><span class="line">    }</span><br/><span class="line"></span><br/><span class="line">    <span class="comment">//存入数据</span></span><br/><span class="line">    <span class="keyword">public</span> <span class="keyword">void</span> <span class="title function_">put</span><span class="params">(<span class="type">int</span> key, <span class="type">int</span> value)</span> {</span><br/><span class="line">        <span class="comment">//先从map中取</span></span><br/><span class="line">        <span class="type">DLinkedNode</span> <span class="variable">node</span> <span class="operator">=</span> cache.get(key);</span><br/><span class="line">        <span class="keyword">if</span> (node == <span class="literal">null</span>) {</span><br/><span class="line">            <span class="comment">// 如果 key 不存在，创建一个新的节点</span></span><br/><span class="line">            <span class="type">DLinkedNode</span> <span class="variable">newNode</span> <span class="operator">=</span> <span class="keyword">new</span> <span class="title class_">DLinkedNode</span>(key, value);</span><br/><span class="line">            <span class="comment">// 添加进哈希表</span></span><br/><span class="line">            cache.put(key, newNode);</span><br/><span class="line">            <span class="comment">// 添加至双向链表的头部</span></span><br/><span class="line">            addToHead(newNode);</span><br/><span class="line">            <span class="comment">//记录元素个数</span></span><br/><span class="line">            ++size;</span><br/><span class="line">            <span class="keyword">if</span> (size &gt; capacity) {</span><br/><span class="line">                <span class="comment">// 如果超出容量，删除双向链表的尾部节点</span></span><br/><span class="line">                <span class="type">DLinkedNode</span> <span class="variable">tail</span> <span class="operator">=</span> removeTail();</span><br/><span class="line">                <span class="comment">// 删除哈希表中对应的项</span></span><br/><span class="line">                cache.remove(tail.key);</span><br/><span class="line">                --size;</span><br/><span class="line">            }</span><br/><span class="line">        }</span><br/><span class="line">        <span class="keyword">else</span> {</span><br/><span class="line">            <span class="comment">// 如果 key 存在，先通过哈希表定位，再修改 value，并移到头部</span></span><br/><span class="line">            node.value = value;</span><br/><span class="line">            moveToHead(node);</span><br/><span class="line">        }</span><br/><span class="line">    }</span><br/><span class="line"></span><br/><span class="line">    <span class="comment">/**</span></span><br/><span class="line"><span class="comment">     *头插</span></span><br/><span class="line"><span class="comment">     */</span></span><br/><span class="line">    <span class="keyword">private</span> <span class="keyword">void</span> <span class="title function_">addToHead</span><span class="params">(DLinkedNode node)</span> {</span><br/><span class="line">        node.prev = head;</span><br/><span class="line">        node.next = head.next;</span><br/><span class="line">        head.next.prev = node;</span><br/><span class="line">        head.next = node;</span><br/><span class="line">    }</span><br/><span class="line">    <span class="comment">/**</span></span><br/><span class="line"><span class="comment">     * 删除节点</span></span><br/><span class="line"><span class="comment">     */</span></span><br/><span class="line">    <span class="keyword">private</span> <span class="keyword">void</span> <span class="title function_">removeNode</span><span class="params">(DLinkedNode node)</span> {</span><br/><span class="line">        node.prev.next = node.next;</span><br/><span class="line">        node.next.prev = node.prev;</span><br/><span class="line">    }</span><br/><span class="line"></span><br/><span class="line">    <span class="comment">/**</span></span><br/><span class="line"><span class="comment">     * 删除该节点</span></span><br/><span class="line"><span class="comment">     * 并把该节点移动到头部</span></span><br/><span class="line"><span class="comment">     */</span></span><br/><span class="line">    <span class="keyword">private</span> <span class="keyword">void</span> <span class="title function_">moveToHead</span><span class="params">(DLinkedNode node)</span> {</span><br/><span class="line">        removeNode(node);</span><br/><span class="line">        addToHead(node);</span><br/><span class="line">    }</span><br/><span class="line"></span><br/><span class="line">    <span class="comment">/**</span></span><br/><span class="line"><span class="comment">     * 删除尾部节点</span></span><br/><span class="line"><span class="comment">     */</span></span><br/><span class="line">    <span class="keyword">private</span> DLinkedNode <span class="title function_">removeTail</span><span class="params">()</span> {</span><br/><span class="line">        <span class="type">DLinkedNode</span> <span class="variable">res</span> <span class="operator">=</span> tail.prev;</span><br/><span class="line">        removeNode(res);</span><br/><span class="line">        <span class="keyword">return</span> res;</span><br/><span class="line">    }</span><br/><span class="line"></span><br/><span class="line">}</span><br/><span class="line"><span class="keyword">public</span> <span class="keyword">class</span> <span class="title class_">Solution</span> {</span><br/><span class="line"></span><br/><span class="line">}</span><br/></pre></td></tr></table></figure>
