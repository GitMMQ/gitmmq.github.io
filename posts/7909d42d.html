    <div class="post-body" itemprop="articleBody"><h1 id="代码解析"><a class="headerlink" href="#代码解析" title="代码解析"></a>代码解析</h1><figure class="highlight java"><table><tr><td class="gutter"><pre><span class="line">1</span><br/><span class="line">2</span><br/><span class="line">3</span><br/><span class="line">4</span><br/><span class="line">5</span><br/><span class="line">6</span><br/><span class="line">7</span><br/><span class="line">8</span><br/><span class="line">9</span><br/><span class="line">10</span><br/><span class="line">11</span><br/><span class="line">12</span><br/><span class="line">13</span><br/><span class="line">14</span><br/><span class="line">15</span><br/><span class="line">16</span><br/><span class="line">17</span><br/><span class="line">18</span><br/><span class="line">19</span><br/><span class="line">20</span><br/><span class="line">21</span><br/><span class="line">22</span><br/><span class="line">23</span><br/><span class="line">24</span><br/><span class="line">25</span><br/><span class="line">26</span><br/><span class="line">27</span><br/><span class="line">28</span><br/><span class="line">29</span><br/><span class="line">30</span><br/><span class="line">31</span><br/><span class="line">32</span><br/><span class="line">33</span><br/><span class="line">34</span><br/><span class="line">35</span><br/><span class="line">36</span><br/><span class="line">37</span><br/><span class="line">38</span><br/><span class="line">39</span><br/><span class="line">40</span><br/><span class="line">41</span><br/><span class="line">42</span><br/><span class="line">43</span><br/><span class="line">44</span><br/><span class="line">45</span><br/><span class="line">46</span><br/><span class="line">47</span><br/><span class="line">48</span><br/><span class="line">49</span><br/><span class="line">50</span><br/><span class="line">51</span><br/><span class="line">52</span><br/><span class="line">53</span><br/><span class="line">54</span><br/><span class="line">55</span><br/><span class="line">56</span><br/><span class="line">57</span><br/><span class="line">58</span><br/><span class="line">59</span><br/><span class="line">60</span><br/><span class="line">61</span><br/><span class="line">62</span><br/><span class="line">63</span><br/><span class="line">64</span><br/><span class="line">65</span><br/><span class="line">66</span><br/><span class="line">67</span><br/><span class="line">68</span><br/><span class="line">69</span><br/><span class="line">70</span><br/><span class="line">71</span><br/><span class="line">72</span><br/><span class="line">73</span><br/><span class="line">74</span><br/><span class="line">75</span><br/><span class="line">76</span><br/><span class="line">77</span><br/><span class="line">78</span><br/><span class="line">79</span><br/><span class="line">80</span><br/><span class="line">81</span><br/><span class="line">82</span><br/><span class="line">83</span><br/><span class="line">84</span><br/><span class="line">85</span><br/><span class="line">86</span><br/><span class="line">87</span><br/><span class="line">88</span><br/><span class="line">89</span><br/><span class="line">90</span><br/><span class="line">91</span><br/><span class="line">92</span><br/><span class="line">93</span><br/><span class="line">94</span><br/><span class="line">95</span><br/><span class="line">96</span><br/><span class="line">97</span><br/><span class="line">98</span><br/><span class="line">99</span><br/><span class="line">100</span><br/><span class="line">101</span><br/><span class="line">102</span><br/></pre></td><td class="code"><pre><span class="line"><span class="keyword">package</span> com.demo.s126;</span><br/><span class="line"></span><br/><span class="line"><span class="keyword">import</span> java.util.*;</span><br/><span class="line"></span><br/><span class="line"><span class="comment">/**</span></span><br/><span class="line"><span class="comment"> * 单词接龙 II</span></span><br/><span class="line"><span class="comment"> * 按字典 wordList 完成从单词 beginWord 到单词 endWord 转化，一个表示此过程的 转换序列 是形式上像 beginWord -&gt; s1 -&gt; s2 -&gt; ... -&gt; sk 这样的单词序列，并满足：</span></span><br/><span class="line"><span class="comment"> *</span></span><br/><span class="line"><span class="comment"> * 每对相邻的单词之间仅有单个字母不同。</span></span><br/><span class="line"><span class="comment"> * 转换过程中的每个单词 si（1 &lt;= i &lt;= k）必须是字典 wordList 中的单词。注意，beginWord 不必是字典 wordList 中的单词。</span></span><br/><span class="line"><span class="comment"> * sk == endWord</span></span><br/><span class="line"><span class="comment"> * 给你两个单词 beginWord 和 endWord ，以及一个字典 wordList 。请你找出并返回所有从 beginWord 到 endWord 的 最短转换序列 ，如果不存在这样的转换序列，返回一个空列表。每个序列都应该以单词列表 [beginWord, s1, s2, ..., sk] 的形式返回。</span></span><br/><span class="line"><span class="comment"> *</span></span><br/><span class="line"><span class="comment"> * 来源：力扣（LeetCode）</span></span><br/><span class="line"><span class="comment"> * 链接：https://leetcode.cn/problems/word-ladder-ii</span></span><br/><span class="line"><span class="comment"> * 著作权归领扣网络所有。商业转载请联系官方授权，非商业转载请注明出处。</span></span><br/><span class="line"><span class="comment"> */</span></span><br/><span class="line"><span class="keyword">public</span> <span class="keyword">class</span> <span class="title class_">Solution</span> {</span><br/><span class="line">    <span class="keyword">public</span> List&lt;List&lt;String&gt;&gt; <span class="title function_">findLadders</span><span class="params">(String beginWord, String endWord, List&lt;String&gt; wordList)</span> {</span><br/><span class="line">        List&lt;List&lt;String&gt;&gt; res = <span class="keyword">new</span> <span class="title class_">ArrayList</span>&lt;&gt;();</span><br/><span class="line">        <span class="comment">// 因为需要快速判断扩展出的单词是否在 wordList 里，因此需要将 wordList 存入哈希表，这里命名为「字典」</span></span><br/><span class="line">        Set&lt;String&gt; dict = <span class="keyword">new</span> <span class="title class_">HashSet</span>&lt;&gt;(wordList);</span><br/><span class="line">        <span class="comment">// 特殊用例判断</span></span><br/><span class="line">        <span class="keyword">if</span> (!dict.contains(endWord)) {</span><br/><span class="line">            <span class="keyword">return</span> res;</span><br/><span class="line">        }</span><br/><span class="line"></span><br/><span class="line">        dict.remove(beginWord);</span><br/><span class="line"></span><br/><span class="line">        <span class="comment">// 第 1 步：广度优先遍历建图</span></span><br/><span class="line">        <span class="comment">// 记录扩展出的单词是在第几次扩展的时候得到的，key：单词，value：在广度优先遍历的第几层</span></span><br/><span class="line">        Map&lt;String, Integer&gt; steps = <span class="keyword">new</span> <span class="title class_">HashMap</span>&lt;&gt;();</span><br/><span class="line">        steps.put(beginWord, <span class="number">0</span>);</span><br/><span class="line">        <span class="comment">// 记录了单词是从哪些单词扩展而来，key：单词，value：单词列表，这些单词可以变换到 key ，它们是一对多关系</span></span><br/><span class="line">        Map&lt;String, List&lt;String&gt;&gt; from = <span class="keyword">new</span> <span class="title class_">HashMap</span>&lt;&gt;();</span><br/><span class="line">        <span class="type">int</span> <span class="variable">step</span> <span class="operator">=</span> <span class="number">1</span>;</span><br/><span class="line">        <span class="type">boolean</span> <span class="variable">found</span> <span class="operator">=</span> <span class="literal">false</span>;</span><br/><span class="line">        <span class="type">int</span> <span class="variable">wordLen</span> <span class="operator">=</span> beginWord.length();</span><br/><span class="line">        Queue&lt;String&gt; queue = <span class="keyword">new</span> <span class="title class_">LinkedList</span>&lt;&gt;();</span><br/><span class="line">        queue.offer(beginWord);</span><br/><span class="line">        <span class="keyword">while</span> (!queue.isEmpty()) {</span><br/><span class="line">            <span class="type">int</span> <span class="variable">size</span> <span class="operator">=</span> queue.size();</span><br/><span class="line">            <span class="keyword">for</span> (<span class="type">int</span> <span class="variable">i</span> <span class="operator">=</span> <span class="number">0</span>; i &lt; size; i++) {</span><br/><span class="line">                <span class="type">String</span> <span class="variable">currWord</span> <span class="operator">=</span> queue.poll();</span><br/><span class="line">                <span class="type">char</span>[] charArray = currWord.toCharArray();</span><br/><span class="line">                <span class="comment">// 将每一位替换成 26 个小写英文字母</span></span><br/><span class="line">                <span class="keyword">for</span> (<span class="type">int</span> <span class="variable">j</span> <span class="operator">=</span> <span class="number">0</span>; j &lt; wordLen; j++) {</span><br/><span class="line">                    <span class="type">char</span> <span class="variable">origin</span> <span class="operator">=</span> charArray[j];</span><br/><span class="line">                    <span class="keyword">for</span> (<span class="type">char</span> <span class="variable">c</span> <span class="operator">=</span> <span class="string">'a'</span>; c &lt;= <span class="string">'z'</span>; c++) {</span><br/><span class="line">                        charArray[j] = c;</span><br/><span class="line">                        <span class="type">String</span> <span class="variable">nextWord</span> <span class="operator">=</span> String.valueOf(charArray);</span><br/><span class="line">                        <span class="keyword">if</span> (steps.containsKey(nextWord) &amp;&amp; step == steps.get(nextWord)) {</span><br/><span class="line">                            from.get(nextWord).add(currWord);</span><br/><span class="line">                        }</span><br/><span class="line">                        <span class="keyword">if</span> (!dict.contains(nextWord)) {</span><br/><span class="line">                            <span class="keyword">continue</span>;</span><br/><span class="line">                        }</span><br/><span class="line">                        <span class="comment">// 如果从一个单词扩展出来的单词以前遍历过，距离一定更远，为了避免搜索到已经遍历到，且距离更远的单词，需要将它从 dict 中删除</span></span><br/><span class="line">                        dict.remove(nextWord);</span><br/><span class="line">                        <span class="comment">// 这一层扩展出的单词进入队列</span></span><br/><span class="line">                        queue.offer(nextWord);</span><br/><span class="line"></span><br/><span class="line">                        <span class="comment">// 记录 nextWord 从 currWord 而来</span></span><br/><span class="line">                        from.putIfAbsent(nextWord, <span class="keyword">new</span> <span class="title class_">ArrayList</span>&lt;&gt;());</span><br/><span class="line">                        from.get(nextWord).add(currWord);</span><br/><span class="line">                        <span class="comment">// 记录 nextWord 的 step</span></span><br/><span class="line">                        steps.put(nextWord, step);</span><br/><span class="line">                        <span class="keyword">if</span> (nextWord.equals(endWord)) {</span><br/><span class="line">                            found = <span class="literal">true</span>;</span><br/><span class="line">                        }</span><br/><span class="line">                    }</span><br/><span class="line">                    charArray[j] = origin;</span><br/><span class="line">                }</span><br/><span class="line">            }</span><br/><span class="line">            step++;</span><br/><span class="line">            <span class="keyword">if</span> (found) {</span><br/><span class="line">                <span class="keyword">break</span>;</span><br/><span class="line">            }</span><br/><span class="line">        }</span><br/><span class="line"></span><br/><span class="line">        <span class="comment">// 第 2 步：深度优先遍历找到所有解，从 endWord 恢复到 beginWord ，所以每次尝试操作 path 列表的头部</span></span><br/><span class="line">        <span class="keyword">if</span> (found) {</span><br/><span class="line">            Deque&lt;String&gt; path = <span class="keyword">new</span> <span class="title class_">ArrayDeque</span>&lt;&gt;();</span><br/><span class="line">            path.add(endWord);</span><br/><span class="line">            dfs(from, path, beginWord, endWord, res);</span><br/><span class="line">        }</span><br/><span class="line">        <span class="keyword">return</span> res;</span><br/><span class="line">    }</span><br/><span class="line"></span><br/><span class="line">    <span class="keyword">public</span> <span class="keyword">void</span> <span class="title function_">dfs</span><span class="params">(Map&lt;String, List&lt;String&gt;&gt; from, Deque&lt;String&gt; path, String beginWord, String cur, List&lt;List&lt;String&gt;&gt; res)</span> {</span><br/><span class="line">        <span class="keyword">if</span> (cur.equals(beginWord)) {</span><br/><span class="line">            res.add(<span class="keyword">new</span> <span class="title class_">ArrayList</span>&lt;&gt;(path));</span><br/><span class="line">            <span class="keyword">return</span>;</span><br/><span class="line">        }</span><br/><span class="line">        <span class="keyword">for</span> (String precursor : from.get(cur)) {</span><br/><span class="line">            path.addFirst(precursor);</span><br/><span class="line">            dfs(from, path, beginWord, precursor, res);</span><br/><span class="line">            path.removeFirst();</span><br/><span class="line">        }</span><br/><span class="line">    }</span><br/><span class="line"></span><br/><span class="line">}</span><br/></pre></td></tr></table></figure>
