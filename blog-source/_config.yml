# Hexo Configuration
# Docs: https://hexo.io/docs/configuration.html

title: Qi
subtitle: Cogito ergo sum
description: recording
keywords: Tech, Data, Vision
author: Meng Qi
language: zh-CN
timezone: Asia/Shanghai

url: https://www.fastolf.com
root: /
permalink: posts/:name.html
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

index_generator:
  path: ''
  per_page: 10
  order_by: -date

default_category: uncategorized
category_map:
tag_map:

meta_generator: true

date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: date

per_page: 10
pagination_dir: page

include:
exclude:
ignore:

theme: next

search:
  path: search.xml
  field: post
  content: true
  format: html

deploy:
  type: ''
