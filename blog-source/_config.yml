# Hexo Configuration
# Docs: https://hexo.io/docs/configuration.html

title: Qi
subtitle: Cogito ergo sum
description: Meng Qi 的技术博客，记录 AI/Agent、算法、数据工程与开发实践。含 Hermes × OpenClaw 系列、Agent 开发路线与 AI 技术编年史。
keywords: AI, Agent, LLM, 算法, 数据工程, Tech, Data, Vision
author: Meng Qi
language: zh-CN
timezone: Asia/Shanghai

url: https://www.fastolf.com
root: /
permalink: posts/:name.html
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
  exclude_languages:
    - mermaid
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

index_generator:
  path: ''
  per_page: 10
  order_by: -date

default_category: uncategorized
category_map:
tag_map:
  Fine-tuning: Fine-Tuning

meta_generator: true

date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: date

per_page: 10
pagination_dir: page

include:
exclude:
ignore:

theme: next

search:
  path: search.xml
  field: post
  content: false
  format: html

feed:
  type: atom
  path: atom.xml
  limit: 30
  content: true
  content_limit: 200
  order_by: -date

sitemap:
  path: sitemap.xml
  tag: false
  category: false

deploy:
  type: ''
