# NexT Theme Configuration
# Docs: https://theme-next.js.org/docs/getting-started/configuration

scheme: Muse
darkmode: true

menu:
  home: / || fa fa-home
  series: /series/ || fa fa-book || 系列
  tags: /tags/ || fa fa-tags
  categories: /categories/ || fa fa-th
  archives: /archives/ || fa fa-archive
  about: /about/ || fa fa-user

menu_settings:
  icons: true
  badges: false

sidebar:
  position: left
  display: post
  padding: 18
  offset: 12
  onmobile: false

avatar:
  url: /images/avatar.gif
  rounded: false
  rotated: false

social:
  GitHub: https://github.com/gitmmq || fab fa-github

github_banner:
  enable: true
  permalink: https://github.com/gitmmq

footer:
  copyright: true

post_meta:
  item_text: true
  created_at: true
  updated_at: true
  categories: true

back2top:
  enable: true
  sidebar: false
  scrollpercent: true

codeblock:
  copy_button:
    enable: true

lazyload: true

local_search:
  enable: true
  top_n_per_article: 1
  unescape: false
  preload: false

busuanzi_count:
  enable: true
  total_visitors: true
  total_visitors_icon: fa fa-user
  total_views: true
  total_views_icon: fa fa-eye
  post_views: true
  post_views_icon: far fa-eye

motion:
  enable: true
  async: false
  transition:
    post_block: fadeIn
    post_header: slideDownIn
    post_body: slideDownIn
    coll_header: slideLeftIn
    sidebar: slideUpIn

vendors:
  internal: local
  plugins: local

mermaid:
  enable: true
  theme:
    light: default
    dark: dark

custom_file_path:
  head: source/_data/head.njk
  bodyEnd: source/_data/body-end.njk
